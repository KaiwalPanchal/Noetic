name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies & package
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Run pytest
      run: |
        pytest tests/ -v --cov=taste_engine --cov-report=term-missing

    - name: Eval harness (rule-based baseline extractor, in-sample regression floor)
      run: |
        python -m taste_engine.evals.run_evals
        python -m taste_engine.evals.run_evals --dataset heldout --threshold 0.5

    - name: Verify CLI and MCP import
      run: |
        overmind doctor
        overmind --help
