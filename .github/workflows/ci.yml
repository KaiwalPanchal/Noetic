name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'

    - name: Install dependencies & package
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Run pytest
      run: |
        pytest tests/ -v --cov=noetic --cov-report=term-missing

    - name: Eval harness (rule-based baseline extractor, in-sample regression floor)
      run: |
        python -m noetic.evals.run_evals
        python -m noetic.evals.run_evals --dataset heldout --threshold 0.5

    - name: Verify CLI and MCP import
      run: |
        noetic doctor
        noetic --help

  package:
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist + wheel and check metadata
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
    - name: Smoke-test the wheel in a clean venv
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install dist/*.whl
        mkdir /tmp/vault
        /tmp/smoke/bin/noetic install --vault /tmp/vault --agents claude
        /tmp/smoke/bin/noetic mcp-config --vault /tmp/vault --client claude-code
        test -f /tmp/vault/CLAUDE.md && test -f /tmp/vault/.mcp.json
